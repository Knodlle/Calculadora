<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Document</title>
</head>
<body>
    <div class="display">
        <p class="result"></p>
    </div>
    <div class="container">
        <button class="displayable" value="1">1</button>
        <button class="displayable" value="2">2</button>
        <button class="displayable" value="3">3</button>
        <button class="displayable" value="4">4</button>
        <button class="displayable" value="5">5</button>
        <button class="displayable" value="6">6</button>
        <button class="displayable" value="7">7</button>
        <button class="displayable" value="8">8</button>
        <button class="displayable" value="9">9</button>
        <button class="displayable" value="0">0</button>
        <button class="displayable" value="+">+</button>
        <button class="displayable" value="-">-</button>
        <button class="displayable" value="*">*</button>
        <button class="displayable" value="/">/</button>
        <button class="displayable" value="=">=</button>
        <button class="displayable" value="clear">clear</button>

    </div>

    <script src="script.js"></script>
</body>
</html>
